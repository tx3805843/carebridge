project_id = "carebridge"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3001"]

[edge_runtime]
enabled = true

# Both functions below authenticate callers with their own scheme (HMAC signature / dedicated
# bearer secret), never a Supabase user JWT — the default per-project JWT gate would reject
# every real caller (Meta, pg_cron) before the function's own auth check ever runs. Read by
# both `supabase functions serve` and `supabase functions deploy`.
[functions.whatsapp-webhook]
verify_jwt = false

[functions.credential-expiry-cron]
verify_jwt = false
